# Valkey del worker (COST-01). La contraseña llega por la línea de órdenes desde el .env
# (compose.yml): nunca en este fichero, que está en el repo.
bind 0.0.0.0 -::*
protected-mode yes
port 6379
maxmemory 512mb
# noeviction: una cola o un contador del gate GCRA que desaparece en silencio es peor que un
# error de escritura visible.
maxmemory-policy noeviction
# RDB cada 5 min si hubo al menos un cambio; sin AOF.
save 300 1
appendonly no
dir /data
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
