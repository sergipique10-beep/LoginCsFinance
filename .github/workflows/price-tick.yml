name: price-tick

# Cron diario que captura un snapshot de precios de las skins seguidas
# (tracked_skins) en precios_historicos. Idempotente (upsert por name+date).
# Despierta el backend en Render (free) aunque esté dormido.
#
# La serie es UNA fila por skin y día, así que una skin que no entre pierde el
# punto de hoy para siempre — y la predicción necesita 20 puntos = 20 días de
# calendario.
#
# PRESUPUESTO (PERF-11): el backend gasta como mucho PRICE_DAILY_BUDGET lookups
# al día (variable de entorno en Render). Cubrir a toda la población no cabía
# en el plan Starter de steamwebapi y agotaba la cuota mensual hacia el día 13.
# Si la población no cabe, entra por prioridad (alerta → inventario →
# trending) y el resto sale como `fuera_de_presupuesto`: el workflow termina en
# verde pero deja un aviso. Ampliar el plan = subir la variable, nada más.
#
# TROCEADO — por qué este workflow tiene un bucle en vez de un solo curl:
# Render free corta las peticiones HTTP largas por su cuenta. Medido en
# producción: 200 skins (~11 min) pasaba; 400 (~22 min) devolvía 502 y se
# perdía la corrida ENTERA (0 puntos escritos ese día, el upsert va al final).
# Ampliar --max-time no arregla nada porque quien cierra es el proxy de Render,
# no curl.
#
# Cada llamada captura un lote de PRICE_LOOKUP_CAP skins (150 ≈ 8 min) y
# devuelve `pendientes`. El bucle repite hasta que llega a 0. Cada lote escribe
# sus puntos antes de responder, así que un fallo en el lote 3 no tira los dos
# primeros.
#
# El _history_limiter (18/60s) es global: mientras corre, /inventory y el chat
# van lentos. De ahí la hora (06:40 UTC) y el sleep entre lotes.

on:
  schedule:
    - cron: "40 6 * * *"   # diario 06:40 UTC
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    # Casi el máximo de GitHub (360) a propósito: el número de lotes lo decide
    # PRICE_DAILY_BUDGET en el backend, y subir esa variable no debe exigir
    # tocar este fichero. 350 min ≈ 42 lotes de 150 ≈ 6 300 skins/día, que es
    # también lo que da de sí el limiter de 18 req/min.
    timeout-minutes: 350
    steps:
      - name: Capturar precios por lotes
        run: |
          # Tope de seguridad: si `pendientes` no baja (bug), esto corta en vez
          # de girar hasta el timeout. Cuadra con timeout-minutes (42 × ~8 min).
          MAX_LOTES=42
          lote=0

          while [ "$lote" -lt "$MAX_LOTES" ]; do
            lote=$((lote + 1))
            echo "── Lote $lote ──"

            # --max-time 900: un lote de 150 tarda ~8 min. Si se pasa de 15 es
            # que Render se durmió o el lote está mal dimensionado.
            RESP=$(curl -fsS --max-time 900 -X POST "$BASE_URL/internal/price-tick" \
              -H "X-Price-Tick-Token: $PRICE_TICK_TOKEN") || {
              echo "::error::El lote $lote falló. Los lotes anteriores sí se guardaron."
              exit 1
            }
            echo "$RESP"

            # PERF-09: un lote sin ninguna captura es un fallo, no un día flojo.
            # Del 23 al 26 de septiembre de 2026 la cuota mensual de steamwebapi
            # estuvo agotada (402 en todo) y el workflow siguió en verde 4 días.
            if echo "$RESP" | grep -q '"quota_exhausted":true'; then
              echo "::error::Cuota mensual de steamwebapi agotada (402). Se reinicia el día 10. Ver PERF-09 y PERF-11 en Plane (CSFIN); si pasa antes de fin de ciclo, PRICE_DAILY_BUDGET está por encima del plan."
              exit 1
            fi
            TRACKED=$(echo "$RESP" | grep -o '"tracked_run":[0-9]*' | cut -d: -f2)
            CAPTURED=$(echo "$RESP" | grep -o '"captured":[0-9]*' | cut -d: -f2)
            if [ "${TRACKED:-0}" -gt 0 ] && [ "${CAPTURED:-0}" -eq 0 ]; then
              echo "::error::Lote de $TRACKED skins con 0 capturas: el lookup falla para todas. Revisa 'errors' y el estado de steamwebapi."
              exit 1
            fi

            PENDIENTES=$(echo "$RESP" | grep -o '"pendientes":[0-9]*' | cut -d: -f2)
            if [ "${PENDIENTES:-0}" -eq 0 ]; then
              # PERF-11: lo que no cabe en el presupuesto no es un fallo del
              # tick, pero esas skins pierden el punto de hoy. Aviso visible.
              FUERA=$(echo "$RESP" | grep -o '"fuera_de_presupuesto":[0-9]*' | cut -d: -f2)
              if [ "${FUERA:-0}" -gt 0 ]; then
                echo "::warning::$FUERA skins se quedan hoy sin punto por el presupuesto diario (PRICE_DAILY_BUDGET). Si pasa a diario, sube la variable en Render o amplía el plan de steamwebapi."
              fi
              echo "✓ Presupuesto del día cubierto en $lote lote(s)."
              exit 0
            fi

            echo "  quedan $PENDIENTES skins"
            # Respiro para que el limiter global no quede saturado de continuo.
            sleep 10
          done

          # Con el presupuesto, `pendientes` baja en cada lote aunque fallen los
          # lookups (se marcan igual): llegar aquí es un bug o un presupuesto
          # por encima de lo que caben 42 lotes (~6 300/día).
          echo "::error::Tras $MAX_LOTES lotes aún quedan $PENDIENTES skins dentro del presupuesto. O PRICE_DAILY_BUDGET supera lo que caben $MAX_LOTES lotes de PRICE_LOOKUP_CAP, o pendientes no baja entre lotes (bug)."
          exit 1
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          PRICE_TICK_TOKEN: ${{ secrets.PRICE_TICK_TOKEN }}
