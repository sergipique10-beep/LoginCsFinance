name: market-tick

# Cron externo que despierta al backend y persiste los rankings del mercado CS2
# en Supabase. Dos cadencias, porque los costes contra steamwebapi son distintos:
#
#   trending (horario)  — GET /items es UNA petición sea cual sea el número de
#                         items que se guarden (~500). Correrlo más de una vez
#                         por hora no da más frescura, solo gasta cuota.
#
#   enrich + movers     — csfloat/history es 1 petición POR ITEM: es el único
#   (cada 15 min)         coste que escala. enrich-tick avanza una rueda sobre
#                         market_trending (los 18 con enriched_at más antiguo);
#                         movers recalcula sus 20 enteros.
#
# Consumo de csfloat/history: (18 + 20) × 4/h = 152 req/h — el mismo que cuando
# trending enriquecía sus 18 en cada tick.
#
# trending-tick hace upsert por `name` (no replace-all), así que reintentos no
# duplican; movers-tick sigue reemplazando su tabla entera.
#
# Los endpoints públicos GET /market/trending y /market/movers solo leen de
# Supabase — nunca llaman a steamwebapi en el path de usuario.

on:
  schedule:
    - cron: "5 * * * *"        # trending: horario, en :05
    - cron: "*/15 * * * *"     # enrich + movers
  workflow_dispatch: {}

jobs:
  trending:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/trending-tick
        # -m 180 (antes 120): ahora persiste ~500 filas en vez de 18, y Render
        # free puede estar dormido al empezar.
        run: |
          curl -fsS -m 180 --retry 2 -X POST "$BASE_URL/internal/trending-tick" -H "X-Cap-Token: $CAP_TICK_TOKEN"
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          CAP_TICK_TOKEN: ${{ secrets.CAP_TICK_TOKEN }}

  enrich-movers:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/enrich-tick
        # 18 llamadas a csfloat/history caben en una ventana del limiter (18/60s).
        run: |
          curl -fsS -m 120 --retry 2 -X POST "$BASE_URL/internal/enrich-tick" -H "X-Cap-Token: $CAP_TICK_TOKEN"
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          CAP_TICK_TOKEN: ${{ secrets.CAP_TICK_TOKEN }}
      - name: POST /internal/movers-tick
        run: |
          curl -fsS -m 120 --retry 2 -X POST "$BASE_URL/internal/movers-tick" -H "X-Cap-Token: $CAP_TICK_TOKEN"
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          CAP_TICK_TOKEN: ${{ secrets.CAP_TICK_TOKEN }}
