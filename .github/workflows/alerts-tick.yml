name: alerts-tick

# PUSH-10: desde 2026-10-05 el backend evalúa las alertas él mismo cada
# ALERTS_TICK_INTERVAL s; este workflow queda de RESPALDO (el schedule de GitHub
# se ejecuta cada 3–9 h, no cada hora).
# Cron externo que evalúa las alertas de precio activas y manda push a sus
# dueños. Minuto :50 para no coincidir con cap-tick (:05), news-tick (:15) ni
# enrich/movers (:00/:15/:30/:45). Cada tick cuesta como mucho ALERTS_LOOKUP_CAP
# requests a steamwebapi (18 por defecto → ≤432/día).

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/alerts-tick
        run: |
          RESP=$(curl -fsS -X POST "$BASE_URL/internal/alerts-tick" -H "X-Alerts-Tick-Token: $ALERTS_TICK_TOKEN")
          echo "$RESP"
          # PERF-09: si hubo alertas que evaluar y TODAS fallaron, el tick no ha
          # hecho nada útil y tiene que verse en rojo (antes: verde con errors=N).
          if echo "$RESP" | grep -q '"quota_exhausted":true'; then
            echo "::error::Cuota mensual de steamwebapi agotada (402): solo se evalúan las skins con precio en market_movers/market_trending hasta el día 10."
            exit 1
          fi
          EVALUATED=$(echo "$RESP" | grep -o '"evaluated":[0-9]*' | cut -d: -f2)
          ERRORS=$(echo "$RESP" | grep -o '"errors":[0-9]*' | cut -d: -f2)
          if [ "${EVALUATED:-0}" -gt 0 ] && [ "${ERRORS:-0}" -ge "${EVALUATED:-0}" ]; then
            echo "::error::$ERRORS errores en $EVALUATED alertas evaluadas: ninguna se pudo resolver."
            exit 1
          fi
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          ALERTS_TICK_TOKEN: ${{ secrets.ALERTS_TICK_TOKEN }}
